<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="../css/reset.css" />
    <link rel="stylesheet" href="../css/common.css" />
    <link rel="stylesheet" href="./css/login.css" />
    <link rel="stylesheet" href="./css/modal.css" />
    <script src="../js/include.js" defer></script>
    <script src="../js/modal.js" defer></script>
  </head>
  <body>
    <div class="log-in-wrap">
      <div class="log-inner">
        <h2 class="font28b">LOGIN</h2>
        <div class="log-box">
          <form method="post" action="./">
            <input
              required
              type="text"
              id="id"
              name="id"
              class="font14"
              placeholder="아이디 또는 전화번호" />
            <input
              required
              type="text"
              id="password"
              name="password"
              class="font14"
              placeholder="비밀번호" />
            <div class="keep-box">
              <input type="checkbox" />
              <span class="custom-checkbox"></span>
              <span class="font14">로그인 상태 유지하기</span>
            </div>
            <button type="submit" class="log-in-btn font16b">로그인</button>
          </form>
          <div class="find-box">
            <a class="font14" href="#void">비밀번호 찾기</a>
            <a class="font14" href="#void">아이디 찾기</a>
            <a class="font14" href="join-membership.html">회원가입</a>
          </div>
        </div>
        <div class="user-data">
          <button class="open-modal" data-target=".terms-of-service">이용약관</button>
          <button class="open-modal" data-target=".privacy-policy">개인정보처리방침</button>
        </div>

        <div data-include="/user/modal-privacy-policy.html"></div>
        <div data-include="/user/modal-terms-of-service.html"></div>
      </div>
    </div>
  </body>
</html>
