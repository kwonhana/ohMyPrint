<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="../css/reset.css" />
    <link rel="stylesheet" href="../css/common.css" />
    <link rel="stylesheet" href="./css/login.css" />
  </head>
  <body>
    <div class="log-in-wrap">
      <div class="log-inner">
        <h2 class="font28b">LOGIN</h2>
        <div class="log-box">
          <form method="post" action="./">
            <input
              type="text"
              id="id"
              name="id"
              class="font14"
              placeholder="아이디 또는 전화번호" />
            <input
              type="text"
              id="password"
              name="password"
              class="font14"
              placeholder="비밀번호" />
          </form>
          <div class="keep-box">
            <input type="checkbox" />
            <span class="custom-checkbox"></span>
            <span class="font14">로그인 상태 유지하기</span>
          </div>
          <div class="log-in-btn font16b"><a href="#void">로그인</a></div>
          <div class="find-box">
            <a class="font14" href="#void">비밀번호 찾기</a>
            <a class="font14" href="#void">아이디 찾기</a>
            <a class="font14" href="#void">회원가입</a>
          </div>
        </div>
        <div class="user-data">
          <a class="font14" href="#void">이용약관</a>
          <a class="font14" href="#void">개인정보처리방침</a>
        </div>
      </div>
    </div>
  </body>
</html>
