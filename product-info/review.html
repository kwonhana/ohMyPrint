    <div class="review-wrap">
      <a href="#" class="back-btn font20b">리뷰작성</a>
      <form action="#" method="post" class="review-form" enctype="multipart/form-data">
        <div class="form-review font14">
          <label for="review-item" class="font20">상품명</label>
          <p>일반명함</p>
        </div>
        <div class="form-review">
          <label for="review-grade" class="font20">별점</label>
          <div class="review-grade-wrap">
            <a href="#"><img src="./images/icon-review-grade.png" alt="리뷰별점" /></a>
            <a href="#"><img src="./images/icon-review-grade.png" alt="리뷰별점" /></a>
            <a href="#"><img src="./images/icon-review-grade.png" alt="리뷰별점" /></a>
            <a href="#"><img src="./images/icon-review-grade.png" alt="리뷰별점" /></a>
            <a href="#"><img src="./images/icon-review-grade.png" alt="리뷰별점" /></a>
          </div>
        </div>
        <div class="form-review font14">
          <label for="review-title" class="font20">리뷰제목</label>
          <input
            type="text"
            id="review-title"
            name="review-title"
            required
            placeholder="리뷰 제목을 써주세요."
          />
        </div>
        <div class="form-review font14">
          <label for="review-content" class="font20">리뷰내용</label>
          <textarea
            id="review-content"
            name="review-content"
            required
            placeholder="리뷰 내용을 작성해주세요."
          ></textarea>
        </div>
        <div class="form-review font14">
          <label for="review-upload" class="font20">첨부파일</label>
          <input type="file" id="review-upload" name="review-upload" />
        </div>
      </form>
      <a href="#" class="write-btn font20b">리뷰작성</a>
    </div>
