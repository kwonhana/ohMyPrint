<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" sizes="96x96" href="/images/favicon.png" />
    <title>상품 리스트 - 오마이프린트</title>
    <link rel="stylesheet" href="../css/reset.css" />
    <link rel="stylesheet" href="../css/common.css" />
    <link rel="stylesheet" href="../css/header.css" />
    <link rel="stylesheet" href="../css/footer.css" />
    <link rel="stylesheet" href="../css/main.css" />
    <link rel="stylesheet" href="./css/productList.css" />
    <link rel="stylesheet" href="../user/css/modal.css" />
    <script src="../js/include.js" defer></script>
    <script src="./js/productList.js" defer></script>
  </head>
  <body>
    <header id="header"></header>
    <main>
      <div class="inner">
        <nav>
          <ul class="main-category">
            <li class="font20b active"><a href="#">명함</a></li>
            <li class="font20b"><a href="#">간판</a></li>
            <li class="font20b"><a href="#">상패</a></li>
            <li class="font20b"><a href="#">현수막</a></li>
            <li class="font20b"><a href="#">흥보용품</a></li>
            <li class="font20b"><a href="#">쿠폰</a></li>
            <li class="font20b"><a href="#">카탈로그</a></li>
            <li class="font20b"><a href="#">실사출력</a></li>
          </ul>
          <ul class="sub-category">
            <li class="font16b active"><a href="#">1</a></li>
            <li class="font16b"><a href="#">2</a></li>
            <li class="font16b"><a href="#">3</a></li>
          </ul>
        </nav>
        <div class="item-wrap">
          <div class="filter-wrap">
            <div class="dropdown">
              <label for="sort">정렬 기준:</label>
              <select id="sort">
                <option value="new">신상품순</option>
                <option value="review">리뷰많은순</option>
                <option value="asc">가나다순</option>
                <option value="desc">역가나다순</option>
              </select>
            </div>
            <div class="search-wrap">
              <input type="text" />
              <button></button>
            </div>
          </div>
          <section class="item-container">
            <div class="card-wrap"></div>
          </section>
        </div>
      </div>
    </main>
    <footer id="footer"></footer>
  </body>
</html>
