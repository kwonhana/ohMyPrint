<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" sizes="96x96" href="/images/favicon.png" />
    <title>문의하기 - 오마이프린트</title>
    <link rel="stylesheet" href="../css/reset.css" />
    <link rel="stylesheet" href="../css/common.css" />
    <link rel="stylesheet" href="../css/header.css" />
    <link rel="stylesheet" href="../css/footer.css" />
    <link rel="stylesheet" href="./css/write.css" />
    <link rel="stylesheet" href="../css/modal.css" />
    <script src="../js/include.js" defer></script>
  </head>
  <body>
    <header id="header"></header>
    <main>
      <section aria-labelledby="writeTitle" class="write-section">
        <div class="top-wrap">
          <a href="#" class="back-btn">
            <img src="../images/sub-arrow.svg" alt="게시물로 돌아가기" />
          </a>
          <h2 id="writeTitle" class="font28b">문의하기</h2>
        </div>

        <form>
          <fieldset>
            <legend class="sr-only" hidden>문의 정보 입력</legend>

            <div class="name-box list">
              <label class="font20b">
                <span class="required">이름</span>
              </label>
              <input
                type="text"
                name="name"
                id="name"
                class="font14b"
                placeholder="이름을 입력해주세요."
                required />
            </div>

            <div class="email-box list">
              <label class="font20b" for="email">
                <span class="required">이메일</span>
              </label>
              <div class="input-wrap">
                <input type="text" id="email" name="email" class="font14b" required />
                @
                <input
                  type="text"
                  id="email-domain"
                  name="email-domain"
                  placeholder="직접입력"
                  required />
              </div>

              <div class="drop-menu-wrap">
                <div class="email-dropdown-toggle">
                  <a href="#">
                    <span class="font14">직접입력</span>
                    <img src="../images/sub-arrow.svg" alt="직접입력" />
                  </a>
                </div>
                <ul id="email-domain-list" hidden>
                  <li data-value="gmail.com">
                    <a href="#" class="font14">gmail.com</a>
                  </li>
                  <li data-value="naver.com">
                    <a href="#" class="font14">naver.com</a>
                  </li>
                  <li data-value="daum.net">
                    <a href="#" class="font14">daum.net</a>
                  </li>
                </ul>
              </div>
            </div>

            <div class="phone-box list">
              <label class="font20b">
                <span class="required">연락처</span>
              </label>
              <div class="drop-menu-wrap">
                <div class="carrier-dropdown-toggle">
                  <a href="#">
                    <span class="font14">통신사</span>
                    <img src="../images/sub-arrow.svg" alt="통신사" />
                  </a>
                </div>
                <ul id="carrier-domain-list" hidden>
                  <li data-value="KT"><a href="#" class="font14">KT</a></li>
                  <li data-value="SKT"><a href="#" class="font14">SKT</a></li>
                  <li data-value="LG"><a href="#" class="font14">LG</a></li>
                  <li data-value="KT-a"><a href="#" class="font14">KT 알뜰폰</a></li>
                  <li data-value="SKT-a">
                    <a href="#" class="font14">SKT 알뜰폰</a>
                  </li>
                </ul>
              </div>

              <div class="input-wrap">
                <input
                  type="tel"
                  name="phone"
                  id="phone1"
                  class="font14b frist"
                  maxlength="4"
                  placeholder="010"
                  required />
                -
                <input
                  type="tel"
                  name="phone"
                  id="phone2"
                  class="font14b sec"
                  maxlength="4"
                  required />
                -
                <input
                  type="tel"
                  name="phone"
                  id="phone3"
                  class="font14b thi"
                  maxlength="4"
                  required />
              </div>
            </div>

            <div class="subject-box list">
              <label class="font20b" for="subject">
                <span class="required">제목</span>
              </label>
              <input
                type="text"
                name="subject"
                id="subject"
                placeholder="제목을 입력해주세요"
                class="font14b"
                required />
            </div>

            <div class="message-box list">
              <label class="font20b">
                <span class="required">내용</span>
              </label>
              <textarea class="font14b" id="message" required></textarea>
            </div>

            <div class="atta-box list">
              <label class="font20b" for="atta">첨부파일</label>
              <input type="text" id="fileName" value="선택된 파일 없음" class="font14b" readonly />
              <input type="file" id="atta" name="atta" class="font14b file-input" />
              <button class="font16b file-up-btn" type="button">파일 올리기</button>
            </div>

            <div class="password-box list">
              <label class="font20b" for="password">
                <span class="required">비밀번호</span>
              </label>
              <input
                type="password"
                name="password"
                id="password"
                class="font14b"
                placeholder="숫자 4자리를 입력해주세요."
                required />
            </div>

            <div class="chack-list">
              <div class="terms-ckbox">
                <input type="checkbox" id="terms-ckbox" class="hidden-check" />
                <label for="terms-ckbox" class="font18b terms custom-label"></label>
                <!-- <span class="font18b">이용약관</span> -->
                <a href="#" class="font16 show open-modal" data-target=".terms-of-service">
                  [보기]
                </a>
                <span class="font16 must">(필수)</span>
              </div>

              <div class="privacy-ckbox">
                <input type="checkbox" id="privacy-ckbox" class="hidden-check" />
                <label for="privacy-ckbox" class="font18b privacy custom-label"></label>
                <!-- <span class="font18b"></span> -->
                <a href="#" class="font16 show open-modal" data-target=".privacy-policy">[보기]</a>
                <span class="font16 must">(필수)</span>
              </div>
            </div>

            <div class="button-wrap">
              <button class="font20b">문의하기</button>
            </div>
          </fieldset>
        </form>
      </section>
    </main>
    <footer id="footer"></footer>
  </body>
</html>
