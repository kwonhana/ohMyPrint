<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Document</title>

  <body>
    <div data-include="../header.html"></div>
    <main>
      <section class="inner">
        <h1 class="font28b notice">공지사항</h1>

        <div class="title">
          <p>오 마이 프린트 몰을 오픈합니다.</p>
          <div>
            <span>게시일:</span>
            <span>2020-11-01</span>
          </div>
        </div>

        <div class="notice-text-box">
          <p>아직 상품도 다 올리지 못하고 부분부분 부족한 점이 많습니다</p>
          <p>그럼에도 불구하고 먼저 오픈합니다.</p>
          <p>부족한점들은 차차 채워 가겠습니다.</p>
          <p>
            여기 올려진 상품과 올려진 상품외에 다른 인쇄상품도 궁금한점 있으시면 언제든 문의해주세요
          </p>
          <p>문의하기에 올리셔도 좋고 카톡채널로 물어보셔도 좋습니다.</p>
          <p>여러분들과 함께하는 오마이프린트가 되겠습니다.</p>
          <p>감사합니다.</p>
        </div>

        <div class="post-list">
          <div class="befor post">
            <a href="#">
              <span class="left-box">이전글</span>
              <span class="title-box">몰 오픈 축하합니다.</span>
              <span class="date-box">2020-09-24</span>
            </a>
          </div>
          <div class="after post">
            <a href="#">
              <span class="left-w">다음글</span>
              <span class="title">등록된 다음 게시물이 없습니다.</span>
              <span class="date-box"></span>
            </a>
          </div>
        </div>

        <button>목록</button>
      </section>
    </main>
    <div data-include="../footer.html"></div>
