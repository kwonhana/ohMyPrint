<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" sizes="96x96" href="/images/favicon.png" />
    <title>견적문의 - 오마이프린트</title>
    <link rel="stylesheet" href="/css/reset.css" />
    <link rel="stylesheet" href="/css/common.css" />
    <link rel="stylesheet" href="/css/header.css" />
    <link rel="stylesheet" href="/css/footer.css" />
    <link rel="stylesheet" href="./css/writeQuote.css" />
    <script src="../js/include.js" defer></script>
  </head>
  <body>
    <main>
      <header id="header"></header>
      <div class="inquiry-container font16">
        <div class="quote-title-wrap">
          <h2>
            사용자 눈높이에 맞춘 최고의 디자인,
            <span class="quote-color">맞춤형/견적</span>
            <span class="quote-title">받아보세요!</span>
          </h2>
          <ul>
            <li>1:1컨설팅</li>
            <li>최적화된 제품 제안</li>
            <li>유지보수</li>
            <li>전국 배송</li>
          </ul>
        </div>

        <form action="#" method="post" class="inquiry-form" enctype="multipart/form-data">
          <div class="form-group font16">
            <label for="username">성함/직함</label>
            <input
              type="text"
              id="username"
              name="username"
              required
              placeholder="홍길동/대표이사" />
          </div>
          <div class="form-group font16">
            <label for="phone">연락처</label>
            <input
              type="tel"
              id="phone"
              name="phone"
              required
              placeholder="010-xxxx-xxxx"
              class="textinput" />
          </div>
          <div class="form-group font16">
            <label for="email">업무용 이메일</label>
            <input
              type="email"
              id="email"
              name="email"
              required
              placeholder="1234112586970@gmail.com" />
          </div>
          <div class="form-group font16">
            <div class="fileupload-wrap">
              <label for="fileUpload">첨부파일 업로드</label>
              <input type="file" id="fileUpload" name="uploadFile" class="upload-file" />
              <div class="upload-wrap">
                <label for="fileUpload" class="upload-btn">파일 올리기</label>
                <span class="upload-select font14">선택된 파일 없음</span>
              </div>
            </div>
          </div>
          <div class="form-group font16">
            <label for="category">카테고리</label>
            <select id="category" name="category">
              <option value="print">실사출력</option>
              <option value="business-card">명함</option>
              <option value="sign">간판</option>
              <option value="award">상패</option>
              <option value="catalog">카탈로그</option>
              <option value="coupon">쿠폰</option>
              <option value="promotion">홍보용품</option>
              <option value="banner">현수막</option>
            </select>
          </div>
          <div class="form-group font16">
            <label for="inquiry">문의내용</label>
            <input
              type="text"
              id="inquiry"
              name="inquiry"
              required
              placeholder="문의내용을 입력하세요." />
          </div>
        </form>
        <div class="check-box">
          <p>개인정보 처리방침</p>
          <p>
            <input type="checkbox" />
            개인정보취급방침에 동의합니다.
            <a href="#">[자세히 보기]</a>
          </p>
        </div>
        <a href="" class="apply-btn">견적 신청하기</a>
        <div class="inquiry-text-box">
          <p>전화상담시 신속한 상담이 이루어집니다.</p>
          <p class="number font28b">02-1234-5678</p>
          <p>상담가능시간 : 09:00~18:00 (점심시간 12:00~13:30)</p>
          <p class="ex">주말,공휴일 제외</p>
        </div>
      </div>
    </main>
    <!-- 푸터 -->

    <footer id="footer"></footer>
  </body>
</html>
